name: Build & Release APK

# Push a tag like v2.1 -> builds, signs, and publishes the APK as a GitHub Release.
# Obtainium on the phone watches releases and installs updates.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > heyron-release.keystore
          cat > keystore.properties <<EOF
          storeFile=heyron-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "APP_VERSION_NAME=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$(( ${BASH_REMATCH[1]}*100 + ${BASH_REMATCH[2]} ))" >> "$GITHUB_ENV"
          else
            # manual dispatch without a tag: keep current defaults
            echo "APP_VERSION_NAME=2.0" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=2" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
