android.useAndroidX=true
kotlin.code.style=official
kotlin.fus.enabled=false
kotlin.build.report.enabled=false
# Container network policy intercepts IPv4-mapped IPv6 loopback (::ffff:127.0.0.1),
# which is what the JVM binds by default -> Gradle daemon handshake dies with
# "Could not receive a message from the daemon". Forcing the IPv4 stack makes the
# daemon bind plain 127.0.0.1, which works. (Diagnosed 2026-10-07.)
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true
